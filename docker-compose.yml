name: charity-hub

services:
  charity-hub:
    build: .
    container_name: charity-hub
    restart: unless-stopped
    ports:
      - "${PORT:-17842}:8080"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_PATH: /data/charity-hub.db
      CREDENTIAL_KEY: ${CREDENTIAL_KEY:?请在 .env 中设置一个 32 字节以上的随机密钥}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置至少 12 位的管理密码}
      SESSION_SECRET: ${SESSION_SECRET:?请在 .env 中设置一个 32 字节以上的会话密钥}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CHECKIN_ENABLED: ${CHECKIN_ENABLED:-true}
      CHECKIN_TIME: ${CHECKIN_TIME:-02:00}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-20}
      CPA_BASE_URL: ${CPA_BASE_URL:-}
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
      MODEL_PROBE_ENABLED: ${MODEL_PROBE_ENABLED:-true}
      MODEL_PROBE_INTERVAL_MINUTES: ${MODEL_PROBE_INTERVAL_MINUTES:-60}
      MODEL_PROBE_TIMEOUT_SECONDS: ${MODEL_PROBE_TIMEOUT_SECONDS:-40}
      MODEL_PROBE_CONCURRENCY: ${MODEL_PROBE_CONCURRENCY:-4}
      MODEL_STATUS_TOKEN: ${MODEL_STATUS_TOKEN:-}
      CPA_SYNC_ENABLED: ${CPA_SYNC_ENABLED:-true}
      CPA_SYNC_FAIL_THRESHOLD: ${CPA_SYNC_FAIL_THRESHOLD:-3}
    volumes:
      - charity_hub_data:/data

volumes:
  charity_hub_data:
